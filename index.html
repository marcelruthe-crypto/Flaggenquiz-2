<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flaggenjagd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Ein helles, freundliches Farbschema für Kinder (bewusst ohne Dark Mode) */
:root {
  --himmel: #cfe6f7;
  --himmel-tief: #a9d0ee;
  --karte: #ffffff;
  --tinte: #14304a;
  --tinte-leise: #5b7186;
  --knopf: #eef5fb;
  --knopf-rand: #b9d2e8;
  --gut: #1f9d55;
  --gut-hell: #dcf5e6;
  --schlecht: #d63a2f;
  --schlecht-hell: #fde3e0;
  --mast: #f2b705;
  --mast-schatten: #c99500;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --text: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; }
[hidden] { display: none !important; }
body {
  background: linear-gradient(180deg, var(--himmel) 0%, var(--himmel-tief) 100%) fixed;
  background-color: var(--himmel);
  color: var(--tinte);
  font-family: var(--text);
  font-size: 19px;
  padding: 16px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left));
  -webkit-tap-highlight-color: transparent;
}
.buehne { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* Kopfzeile */
.kopf { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--display); font-weight: 800; font-size: 1.8rem; display: flex; align-items: center; gap: 8px; }
.logo svg { width: 32px; height: 32px; }
.stand { display: flex; align-items: center; gap: 14px; }
.runde { font-family: var(--display); font-weight: 800; font-size: 1.3rem; font-variant-numeric: tabular-nums; background: var(--karte); padding: 2px 14px; border-radius: 99px; }
.leben { display: flex; gap: 4px; }
.leben svg { width: 32px; height: 32px; transition: transform .3s, opacity .3s; }
.leben svg.weg { opacity: .2; transform: scale(.75); }
.leben svg.platzt { animation: platzen .6s ease-out; }
@keyframes platzen { 30% { transform: scale(1.5); } 100% { transform: scale(.75); opacity: .2; } }

/* Spielkarte */
.karte { background: var(--karte); border-radius: 26px; padding: 22px; box-shadow: 0 10px 30px rgba(20,48,74,.12); display: flex; flex-direction: column; gap: 18px; }
.leiste { height: 10px; background: var(--knopf); border-radius: 99px; overflow: hidden; }
.leiste i { display: block; height: 100%; background: var(--mast); transition: width .4s; border-radius: 99px; }
.typ { align-self: center; font-size: .85rem; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; color: var(--tinte-leise); background: var(--knopf); padding: 4px 14px; border-radius: 99px; }
.typ.neu { background: var(--mast); color: var(--tinte); }
.bildfeld { display: flex; justify-content: center; }
.flagge { display: block; width: min(100%, 340px); aspect-ratio: 4 / 3; border-radius: 10px; box-shadow: 0 0 0 1px rgba(20,48,74,.15), 0 6px 16px rgba(20,48,74,.14); object-fit: cover; background: var(--karte); }
.t-spiegeln { transform: scaleX(-1); }
.t-kopf { transform: scaleY(-1); }
.t-drehen { transform: rotate(180deg); }
.kreis { width: min(70%, 230px); aspect-ratio: 1; }
h1.frage { font-family: var(--display); font-weight: 800; font-size: 1.75rem; line-height: 1.2; margin: 0; text-wrap: balance; text-align: center; }
.hinweis { text-align: center; color: var(--tinte-leise); margin: -8px 0 0; font-weight: 800; }

/* Antwortknöpfe: groß und gut zu treffen */
.antworten { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.antworten.lang { grid-template-columns: 1fr; }
.antwort {
  font: inherit; font-weight: 900; font-size: 1.3rem; color: var(--tinte);
  background: var(--knopf); border: 3px solid var(--knopf-rand); border-radius: 18px;
  min-height: 76px; padding: 12px 14px; cursor: pointer; touch-action: manipulation;
  display: flex; align-items: center; justify-content: center; gap: 10px; text-align: center;
  box-shadow: 0 4px 0 var(--knopf-rand); transition: transform .1s, background .2s, border-color .2s;
  min-width: 0; overflow-wrap: anywhere; position: relative;
}
.antwort:hover:not(:disabled) { border-color: var(--tinte-leise); }
.antwort:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--knopf-rand); }
.antwort:focus-visible { outline: 4px solid var(--mast); outline-offset: 2px; }
.antwort:disabled { cursor: default; }
.antworten.lang .antwort { font-size: 1.2rem; justify-content: flex-start; text-align: left; }
.antworten.bilder .antwort { flex-direction: column; padding: 10px; font-size: 1.05rem; }
.antwort .flagge { width: 100%; box-shadow: 0 0 0 1px rgba(20,48,74,.15); }
.tupfer { width: 34px; height: 34px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(20,48,74,.25); flex: none; }
.antwort.richtig { background: var(--gut-hell); border-color: var(--gut); box-shadow: 0 4px 0 var(--gut); animation: huepfen .45s; }
.antwort.falsch { background: var(--schlecht-hell); border-color: var(--schlecht); box-shadow: 0 4px 0 var(--schlecht); animation: wackeln .4s; }
.antwort.blass { opacity: .4; }
.antwort .zeichen { position: absolute; top: -12px; right: -10px; width: 34px; height: 34px; border-radius: 50%; color: #fff; font-size: 1.2rem; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
.antwort.richtig .zeichen { background: var(--gut); }
.antwort.falsch .zeichen { background: var(--schlecht); }
@keyframes huepfen { 40% { transform: scale(1.06); } }
@keyframes wackeln { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* Rückmeldung nach der Antwort */
.ergebnis { border-radius: 18px; padding: 16px 18px; line-height: 1.45; display: flex; flex-direction: column; gap: 12px; animation: rein .3s ease-out; }
.ergebnis.gut { background: var(--gut-hell); }
.ergebnis.schlecht { background: var(--schlecht-hell); }
.ergebnis .meldung { font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1; }
.ergebnis.gut .meldung { color: var(--gut); }
.ergebnis.schlecht .meldung { color: var(--schlecht); }
.ergebnis .text { font-weight: 800; font-size: 1.15rem; }
@keyframes rein { from { opacity: 0; transform: translateY(8px); } }

.haupt { font: inherit; font-family: var(--display); font-weight: 800; font-size: 1.6rem; color: var(--tinte); background: var(--mast); border: none; border-radius: 18px; min-height: 64px; padding: 10px 28px; cursor: pointer; box-shadow: 0 5px 0 var(--mast-schatten); touch-action: manipulation; }
.haupt:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--mast-schatten); }
.haupt:focus-visible { outline: 4px solid var(--tinte); outline-offset: 3px; }

/* Start- und Endbildschirm */
.mitte { text-align: center; align-items: center; }
.mitte p { margin: 0; max-width: 34ch; line-height: 1.5; font-weight: 600; }
.parade { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.parade img { width: 58px; aspect-ratio: 4/3; border-radius: 5px; box-shadow: 0 0 0 1px rgba(20,48,74,.15); animation: wehen 2.4s ease-in-out infinite; }
.parade img:nth-child(2n) { animation-delay: .3s; } .parade img:nth-child(3n) { animation-delay: .6s; }
@keyframes wehen { 50% { transform: translateY(-4px) rotate(-2deg); } }
.punkte { font-family: var(--display); font-size: 4.5rem; font-weight: 800; line-height: 1; color: var(--gut); }
.rekord { font-weight: 900; background: var(--knopf); border-radius: 99px; padding: 6px 16px; }
.rekord.neu { background: var(--mast); }
.klein { font-size: .85rem; color: var(--tinte-leise); text-align: center; margin: 0; }
.klein a { color: inherit; }

/* Konfetti bei Meilensteinen */
.konfetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.konfetti i { position: absolute; top: -20px; width: 12px; height: 16px; border-radius: 3px; animation: fallen 1.6s ease-in forwards; }
@keyframes fallen { to { transform: translateY(110vh) rotate(720deg); } }

@media (max-width: 420px) {
  body { font-size: 17px; }
  .karte { padding: 16px; gap: 14px; }
  h1.frage { font-size: 1.5rem; }
  .antwort { font-size: 1.15rem; min-height: 68px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="buehne">
  <div class="kopf">
    <div class="logo"><svg viewBox="0 0 30 30" aria-hidden="true"><rect x="5" y="3" width="3" height="25" rx="1.5" fill="#14304a"/><path d="M8 4h17l-4 5 4 5H8z" fill="#d63a2f"/></svg>Flaggenjagd</div>
    <div class="stand" id="stand" hidden>
      <span class="runde" id="runde">Runde 1</span>
      <span class="leben" id="leben" role="img" aria-label="3 Leben"></span>
    </div>
  </div>
  <main class="karte" id="karte" aria-live="polite"><p class="klein">Lade Fragen …</p></main>
  <p class="klein">Flaggen-Grafiken: flag-icons (<a href="flaggenquiz-daten/flaggen/LIZENZ-flag-icons.txt">MIT-Lizenz</a>)</p>
</div>

<script>
const DATEN = "flaggenquiz-daten/";
const TYPNAME = {
  land_erkennen: "Welches Land?", flagge_waehlen: "Finde die Flagge", farben_zaehlen: "Farben zählen",
  farbe_fehlt: "Welche Farbe fehlt?", sterne_zaehlen: "Sterne zählen", richtig_herum: "Richtig herum?",
  fehler_finden: "Fehler finden", gespiegelt: "Spiegel-Detektiv", farbanteile: "Farbkreis"
};
const LOB = ["Super!", "Richtig!", "Klasse!", "Stark!", "Genau!", "Toll!", "Prima!", "Spitze!"];
const TROST = ["Schade!", "Knapp daneben!", "Oh nein!"];
const MEILENSTEIN = { 10: "10 Runden geschafft!", 25: "25 Runden! Wow!", 50: "50 Runden! Du bist ein Flaggen-Profi!", 100: "100 Runden! Unglaublich!", 150: "150 Runden! Fast alle!" };
const REKORD_KEY = "flaggenjagd-rekord";

let NACH_ID = {}, ABLAUF = [];
let zustand = {};
const $ = s => document.querySelector(s);
const karte = $("#karte");
const zufall = liste => liste[Math.floor(Math.random() * liste.length)];

/* Rekord nur als Komfort im Browser merken; ohne Speicher läuft das Spiel genauso */
function leseRekord() { try { return +localStorage.getItem(REKORD_KEY) || 0; } catch { return 0; } }
function schreibeRekord(n) { try { localStorage.setItem(REKORD_KEY, String(n)); } catch {} }

const herz = (an, platzt) => `<svg viewBox="0 0 24 24" aria-hidden="true" class="${an ? "" : "weg"} ${platzt ? "platzt" : ""}"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3.1 1.7-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="#d63a2f"/></svg>`;

const bildHTML = b => `<img class="flagge t-${b.transform}" src="${DATEN + b.datei}" alt="Flagge">`;

function kreisHTML(teile) {
  const r = 100, c = 105;
  if (teile.length === 1) return `<svg class="kreis" viewBox="0 0 210 210" role="img" aria-label="Farbkreis"><circle cx="${c}" cy="${c}" r="${r}" fill="${teile[0].hex}" stroke="#14304a" stroke-width="2"/></svg>`;
  let a = -Math.PI / 2, s = "";
  for (const t of teile) {
    const b = a + t.anteil * 2 * Math.PI;
    const gross = t.anteil > 0.5 ? 1 : 0;
    s += `<path d="M${c},${c} L${c + r * Math.cos(a)},${c + r * Math.sin(a)} A${r},${r} 0 ${gross} 1 ${c + r * Math.cos(b)},${c + r * Math.sin(b)} Z" fill="${t.hex}" stroke="#14304a" stroke-width="2" stroke-linejoin="round"/>`;
    a = b;
  }
  return `<svg class="kreis" viewBox="0 0 210 210" role="img" aria-label="Farbkreis">${s}</svg>`;
}

/* Bilder der nächsten Runde schon vorladen, damit nichts ruckelt */
function vorladen(q) {
  if (!q) return;
  [q.bild, ...q.antworten.map(a => a.bild)].forEach(b => { if (b) new Image().src = DATEN + b.datei; });
}

/* ---------- Spiel ---------- */
function startSpiel() {
  zustand = { runde: 0, leben: 3, punkte: 0, serie: 0, gesehen: new Set(), rekordVorher: leseRekord() };
  karte.classList.remove("mitte");
  $("#stand").hidden = false;
  naechsteRunde();
}

function kopf(platzt) {
  $("#runde").textContent = `Runde ${zustand.runde + 1}`;
  $("#leben").innerHTML = [0, 1, 2].map(i => herz(i < zustand.leben, platzt && i === zustand.leben)).join("");
  $("#leben").setAttribute("aria-label", `${zustand.leben} Leben`);
}

function naechsteRunde() {
  if (zustand.runde >= ABLAUF.length) return ende(true);
  const q = NACH_ID[ABLAUF[zustand.runde].frage_id];
  kopf(false);

  const neuerTyp = !zustand.gesehen.has(q.typ) && zustand.runde > 0;
  zustand.gesehen.add(q.typ);

  let oben = "";
  if (q.farbkreis) oben = `<div class="bildfeld">${kreisHTML(q.farbkreis)}</div>`;
  else if (q.bild) oben = `<div class="bildfeld">${bildHTML(q.bild)}</div>`;

  const bilder = q.antworten.some(a => a.bild);
  const lang = !bilder && q.antworten.some(a => (a.text || "").length > 14);
  const ant = q.antworten.map((a, i) => {
    let inhalt = "";
    if (a.bild) inhalt += bildHTML(a.bild);
    if (a.farbe_hex) inhalt += `<span class="tupfer" style="background:${a.farbe_hex}"></span>`;
    if (a.text) inhalt += `<span>${a.text}</span>`;
    return `<button class="antwort" data-i="${i}" aria-label="${a.text || `Flagge ${i + 1}`}">${inhalt}</button>`;
  }).join("");

  const pct = (zustand.runde / ABLAUF.length) * 100;
  karte.innerHTML = `<div class="leiste" aria-hidden="true"><i style="width:${pct}%"></i></div>
    <div class="typ ${neuerTyp ? "neu" : ""}">${neuerTyp ? "Neu: " : ""}${TYPNAME[q.typ]}</div>
    ${oben}
    <h1 class="frage">${q.frage}</h1>
    ${q.hinweis ? `<p class="hinweis">${q.hinweis}</p>` : ""}
    <div class="antworten ${bilder ? "bilder" : ""} ${lang ? "lang" : ""}">${ant}</div>
    <div id="rueck"></div>`;
  document.querySelectorAll(".antwort").forEach(b => b.onclick = () => antworte(q, +b.dataset.i));
  zustand.frage = q;
  zustand.wartet = true;
  window.scrollTo({ top: 0 });
  vorladen(NACH_ID[ABLAUF[zustand.runde + 1]?.frage_id]);
}

function antworte(q, gewaehlt) {
  if (!zustand.wartet) return;
  zustand.wartet = false;
  const ok = gewaehlt === q.richtig;

  document.querySelectorAll(".antwort").forEach((b, i) => {
    b.disabled = true;
    if (i === q.richtig) { b.classList.add("richtig"); b.insertAdjacentHTML("beforeend", `<span class="zeichen" aria-hidden="true">✓</span>`); }
    else if (i === gewaehlt) { b.classList.add("falsch"); b.insertAdjacentHTML("beforeend", `<span class="zeichen" aria-hidden="true">✗</span>`); }
    else b.classList.add("blass");
  });

  if (ok) { zustand.punkte++; zustand.serie++; } else { zustand.leben--; zustand.serie = 0; }
  kopf(!ok);

  const geschafft = zustand.runde + 1;
  let meldung = ok ? zufall(LOB) : zufall(TROST);
  if (ok && MEILENSTEIN[geschafft]) { meldung = MEILENSTEIN[geschafft]; konfetti(); }
  else if (ok && zustand.serie > 0 && zustand.serie % 5 === 0) meldung = `${zustand.serie} richtig hintereinander!`;

  let leben = "";
  if (!ok) leben = zustand.leben > 0
    ? `<span class="text">Du hast noch ${zustand.leben === 1 ? "ein Leben" : `${zustand.leben} Leben`}.</span>` : "";

  const vorbei = zustand.leben <= 0;
  $("#rueck").innerHTML = `<div class="ergebnis ${ok ? "gut" : "schlecht"}">
      <span class="meldung">${meldung}</span>
      <span class="text">${q.aufloesung}</span>
      ${leben}
      <button class="haupt" id="weiter">${vorbei ? "Zum Ergebnis" : "Weiter"}</button></div>`;
  const weiter = $("#weiter");
  weiter.onclick = () => { zustand.runde++; vorbei ? ende(false) : naechsteRunde(); };
  weiter.focus({ preventScroll: true });
  $("#rueck").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function ende(alles) {
  $("#stand").hidden = true;
  karte.classList.add("mitte");
  const geschafft = zustand.punkte;
  const neuerRekord = geschafft > zustand.rekordVorher;
  if (neuerRekord) { schreibeRekord(geschafft); konfetti(); }
  const titel = alles ? "Du hast alle Runden geschafft!"
    : geschafft >= 50 ? "Wahnsinn!" : geschafft >= 20 ? "Super gespielt!" : geschafft >= 8 ? "Gut gemacht!" : "Schön, dass du gespielt hast!";
  const rekord = neuerRekord
    ? `<span class="rekord neu">Neuer Rekord!</span>`
    : zustand.rekordVorher ? `<span class="rekord">Dein Rekord: ${zustand.rekordVorher}</span>` : "";
  karte.innerHTML = `<div class="punkte">${geschafft}</div>
    <h1 class="frage">${titel}</h1>
    <p>${geschafft === 1 ? "Eine Flagge" : `${geschafft} Flaggen`} richtig.${alles ? "" : ` Du bist bis Runde ${zustand.runde} gekommen.`}</p>
    ${rekord}
    <button class="haupt" id="nochmal">Nochmal spielen</button>`;
  $("#nochmal").onclick = startSpiel;
  $("#nochmal").focus({ preventScroll: true });
}

function startseite() {
  $("#stand").hidden = true;
  karte.classList.add("mitte");
  const parade = ["de", "jp", "br", "ca", "ch", "se", "gb", "kr"].map(c => `<img src="${DATEN}flaggen/${c}.svg" alt="">`).join("");
  const r = leseRekord();
  karte.innerHTML = `<div class="parade">${parade}</div>
    <h1 class="frage">Wie viele Flaggen kennst du?</h1>
    <p>Es geht leicht los und wird mit jeder Runde schwerer. Du hast drei Leben. Schaffst du alle ${ABLAUF.length} Runden?</p>
    ${r ? `<span class="rekord">Dein Rekord: ${r}</span>` : ""}
    <button class="haupt" id="los">Los geht's!</button>`;
  $("#los").onclick = startSpiel;
}

function konfetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const farben = ["#d63a2f", "#f2b705", "#1f9d55", "#2b6fd6", "#ff8a00", "#9b51e0"];
  const box = document.createElement("div");
  box.className = "konfetti";
  for (let i = 0; i < 60; i++) {
    const s = document.createElement("i");
    s.style.left = Math.random() * 100 + "vw";
    s.style.background = zufall(farben);
    s.style.animationDelay = Math.random() * .5 + "s";
    s.style.animationDuration = 1.2 + Math.random() * 1 + "s";
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 3000);
}

/* Tastatur: 1–4 bzw. a–d wählen eine Antwort */
document.addEventListener("keydown", e => {
  if (!zustand.wartet || e.ctrlKey || e.metaKey || e.altKey) return;
  const i = "1234".indexOf(e.key) >= 0 ? "1234".indexOf(e.key) : "abcd".indexOf(e.key.toLowerCase());
  if (i >= 0) antworte(zustand.frage, i);
});

Promise.all([fetch(DATEN + "fragen.json").then(r => r.json()), fetch(DATEN + "spielablauf.json").then(r => r.json())])
  .then(([f, a]) => {
    ABLAUF = a;
    f.fragen.forEach(q => NACH_ID[q.id] = q);
    startseite();
  })
  .catch(() => { karte.innerHTML = `<p class="klein">Die Fragen konnten nicht geladen werden. Die Seite braucht einen kleinen Webserver, z. B. <code>python3 -m http.server</code>.</p>`; });
</script>
</body>
</html>
